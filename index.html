<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoja de ruta · Torrent Pharma Chile</title>
<meta name="description" content="Tablero del proceso O2C y cierre contable de Torrent Pharma Chile SpA (sociedad T303, planta E303): las 27 actividades del ciclo mensual, el calendario, el catálogo de 16 reportes, la matriz RACI, los riesgos y los próximos pasos. Preparado por Finanzas LATAM.">

<!-- Manrope: la tipografía institucional (DISENO.md §1.1).
     El §7.4 registra que no viene con Windows ni con Office y que en las
     presentaciones de trabajo no está incrustada; aquí se sirve desde
     Google Fonts, con una pila de respaldo declarada en tokens.css. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/app.css">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23292662'/><text x='16' y='22' font-family='system-ui,sans-serif' font-size='16' font-weight='700' fill='%23C3B2D4' text-anchor='middle'>T</text></svg>">
</head>
<body>

<a class="skip-link" href="#main">Saltar al contenido</a>

<div class="app">

  <!-- Marca -->
  <header class="brand">
    <span class="brand__mark" aria-hidden="true">T</span>
    <div class="brand__text">
      <div class="brand__name">Torrent Pharma Chile</div>
      <div class="brand__unit">Finanzas LATAM · T303</div>
    </div>
  </header>

  <!-- Barra superior -->
  <div class="topbar">
    <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Abrir el menú de navegación">
      ☰ Menú
    </button>
    <span class="topbar__title" id="topbar-title">Resumen</span>
    <div class="topbar__meta" id="topbar-meta"></div>
  </div>

  <!-- Navegación -->
  <nav class="nav" id="nav" aria-label="Secciones del tablero"></nav>

  <!-- Contenido -->
  <main class="main" id="main" tabindex="-1">
    <div id="view"></div>

    <!-- Pie: filete violeta + lockup (DISENO.md §3.2).
         El §3.2 señala que en las diapositivas el pie tiene cuatro líneas
         base distintas para lo que debería ser una sola; aquí es una. -->
    <footer class="footer">
      <span>Hoja de ruta de actividades · Torrent Pharma Chile SpA (T303) · Finanzas LATAM</span>
      <span>Fuente: documento de proceso O2C v1.0 · 6 de agosto de 2026</span>
      <span>For internal circulation only. © Torrent Pharmaceuticals Limited</span>
      <button class="btn btn--ghost btn--sm" id="btn-print" type="button">Imprimir</button>
      <span class="footer__lockup">TORRENT<span> PHARMA</span></span>
    </footer>
  </main>

</div>

<!-- Panel de detalle: "click and fill" -->
<div class="drawer-backdrop" id="drawer-backdrop"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="drawer-title">
  <header class="drawer__head">
    <div>
      <div class="drawer__eyebrow" id="drawer-eyebrow"></div>
      <h2 class="drawer__title" id="drawer-title"></h2>
    </div>
    <button class="drawer__close" id="drawer-close" type="button" aria-label="Cerrar el panel de detalle">×</button>
  </header>
  <div class="drawer__body" id="drawer-body"></div>
</aside>

<!-- Visor de figuras a pantalla completa -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-labelledby="lb-title">
  <div class="lightbox__bar">
    <div>
      <div class="lightbox__title" id="lb-title"></div>
      <div class="lightbox__sub" id="lb-sub"></div>
    </div>
    <div class="lightbox__tools">
      <div class="figure__langs" id="lb-langs"></div>
      <button class="lightbox__btn" id="lb-fit" type="button" aria-pressed="true">Ajustar</button>
      <button class="lightbox__btn" id="lb-out" type="button" aria-label="Alejar">−</button>
      <span class="lightbox__zoomval" id="lb-val">100%</span>
      <button class="lightbox__btn" id="lb-in" type="button" aria-label="Acercar">+</button>
      <button class="lightbox__btn" id="lb-close" type="button" aria-label="Cerrar el visor">✕ Cerrar</button>
    </div>
  </div>
  <div class="lightbox__stage is-fit" id="lb-stage">
    <img id="lb-img" src="" alt="">
  </div>
  <div class="lightbox__foot" id="lb-foot"></div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
